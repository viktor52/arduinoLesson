services:
  postgres:
    image: postgres:16-alpine
    container_name: arduino-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arduino
      POSTGRES_PASSWORD: arduino123
      POSTGRES_DB: arduino_learning
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arduino -d arduino_learning"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: arduino-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://arduino:arduino123@postgres:5432/arduino_learning?schema=public
      PORT: 3001
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:8080
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    container_name: arduino-client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  postgres_data:
